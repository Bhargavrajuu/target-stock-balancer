<title>Target Stock Balancer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>/* Layout: report header band, then a two-column workspace (findings left, algorithm + controls right), AI analyst at the end of the findings column. */
:root{
  --bg:#ffffff; --panel:#f6f6f5; --ink:#111111; --ink-2:#4a4a48; --ink-3:#8c8c89; --line:#e3e3e0; --grid:#ececea;
  --good:#2f7a4a; --warn:#a86b12; --bad:#b33a2a;
  --c1:#111111; --c2:#8c8c89; --c3:#b33a2a; --c4:#3c6a9c; --c5:#2f7a4a; --c6:#a86b12; --c7:#6f5a9c;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f; --panel:#181818; --ink:#f2f2f0; --ink-2:#c2c2bf; --ink-3:#86868a; --line:#2c2c2c; --grid:#232323;
  --good:#6cc08a; --warn:#e0a548; --bad:#ec7a68;
  --c1:#f2f2f0; --c2:#86868a; --c3:#ec7a68; --c4:#7fa9db; --c5:#6cc08a; --c6:#e0a548; --c7:#ad97dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0f; --panel:#181818; --ink:#f2f2f0; --ink-2:#c2c2bf; --ink-3:#86868a; --line:#2c2c2c; --grid:#232323;
  --good:#6cc08a; --warn:#e0a548; --bad:#ec7a68;
  --c1:#f2f2f0; --c2:#86868a; --c3:#ec7a68; --c4:#7fa9db; --c5:#6cc08a; --c6:#e0a548; --c7:#ad97dc; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:18px 14px;border-bottom:1px solid var(--ink);
  font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.top b{color:var(--ink);font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;padding-block:28px 28px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:clamp(30px,4.4vw,50px);line-height:1.02;letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.hero .co{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 10px}
.hero .co span{font-family:var(--f-mono);font-weight:400;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:8px}
.hero p{margin:0;max-width:62ch;color:var(--ink-2)}
.brief{border-left:2px solid var(--ink);padding-left:16px;align-self:end}
.brief h2{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:500}
.brief p{font-size:14px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:20px}}

/* workspace */
.ws{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;padding-top:28px}
@media (max-width:1000px){.ws{grid-template-columns:1fr}}
.main{display:flex;flex-direction:column;gap:28px;min-width:0}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (min-width:1001px){.side{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}}

.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
h3.sec{font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:21px;letter-spacing:-.005em;margin:0 0 4px;text-wrap:balance}
.secnote{margin:0 0 14px;color:var(--ink-2);font-size:14px;max-width:70ch}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.kpi{padding:14px 16px 16px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi + .kpi{padding-left:16px;border-left:1px solid var(--line)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v.long{font-size:19px;line-height:1.2;letter-spacing:0}
.kpi .n{font-size:12.5px;color:var(--ink-2)}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)}
@media (max-width:560px){.kpi + .kpi{border-left:0;padding-left:0}.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(even){padding-left:16px;border-left:1px solid var(--line)}}

.section{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,540px),1fr));gap:28px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:340px}
.ct{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-2)}
.ctb{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* table */
.tbl{overflow-x:auto;border-top:1px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:left;padding:10px 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;border-radius:999px;white-space:nowrap}
.pill.bad{color:var(--bad)} .pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.mut{color:var(--ink-3)}

/* recs */
.recs{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.rec{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rec .i{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.rec h4{margin:0 0 3px;font-size:15px;font-weight:650}
.rec p{margin:0;color:var(--ink-2);font-size:14px}
.rec .imp{font-family:var(--f-mono);font-size:12px;white-space:nowrap;text-align:right}
@media (max-width:560px){.rec{grid-template-columns:28px minmax(0,1fr)}.rec .imp{grid-column:2;text-align:left}}

/* side panels */
.panel{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;line-height:1}
.steps li.done::before{background:var(--ink);color:var(--bg)}
.steps .t{font-size:13.5px;font-weight:600;line-height:1.3}
.steps .m{font-size:12px;color:var(--ink-3);line-height:1.35}
.steps .o{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl label{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.ctrl label b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink)}
select{background:var(--bg);border:1px solid var(--line);padding:6px 8px;width:100%}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover:not(:disabled){opacity:.85}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:12px;color:var(--ink-3)}

/* AI analyst */
.ai{border:1px solid var(--ink);display:flex;flex-direction:column}
.ai-h{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ai-h h3{margin:0}
.log{display:flex;flex-direction:column;gap:14px;padding:16px;max-height:520px;overflow:auto;min-height:120px}
.msg{max-width:80ch;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--panel);padding:8px 12px}
.msg.a p{margin:0 0 8px} .msg.a ul{margin:0 0 8px;padding-left:20px} .msg.a li{margin-bottom:3px}
.msg.a h5{font-size:14px;margin:6px 0 4px}
.msg.sys{color:var(--ink-3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;padding:6px 10px;font-size:12.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.ask{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.ask textarea{flex:1;min-width:0;resize:vertical;min-height:44px;max-height:180px;border:1px solid var(--line);background:var(--bg);padding:10px}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
@media (prefers-reduced-motion:no-preference){.steps li{transition:opacity .2s}}

<script>"use strict";
/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function RNG(seed) {
  let a = seed >>> 0;

  r.n = (m = 0, s = 1) => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  r.u = (lo, hi) => lo + (hi - lo) * r();
  r.wpick = (arr, w) => { const t = w.reduce((x, y) => x + y, 0); let x = r() * t; for (let i = 0; i < arr.length; i++) { x -= w[i]; if (x <= 0) return arr[i]; } return arr[arr.length - 1]; };
  return r;
}
const S = {
  sum: a => a.reduce((x, y) => x + y, 0),
  mean: a => a.length ? S.sum(a) / a.length : 0,
  sd(a) { const m = S.mean(a); return Math.sqrt(S.sum(a.map(x => (x - m) ** 2)) / Math.max(1, a.length - 1)); },
  corr(x, y) { const mx = S.mean(x), my = S.mean(y); let n = 0, dx = 0, dy = 0; for (let i = 0; i < x.length; i++) { n += (x[i] - mx) * (y[i] - my); dx += (x[i] - mx) ** 2; dy += (y[i] - my) ** 2; } return dx && dy ? n / Math.sqrt(dx * dy) : 0; },
  sigmoid: z => 1 / (1 + Math.exp(-z)),
  clamp: (x, a, b) => Math.max(a, Math.min(b, x)),
  quantile(a, q) { const s = [...a].sort((x, y) => x - y); const i = (s.length - 1) * q, lo = Math.floor(i); return s[lo] + (s[Math.min(lo + 1, s.length - 1)] - s[lo]) * (i - lo); },
  range: n => Array.from({ length: n }, (_, i) => i),
  groupBy(arr, f) { const m = new Map(); for (const x of arr) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; },
  zNorm(p) { // inverse normal CDF (Acklam)
    const a = [-39.6968302866538, 220.946098424521, -275.928510446969, 138.357751867269, -30.6647980661472, 2.50662827745924], b = [-54.4760987982241, 161.585836858041, -155.698979859887, 66.8013118877197, -13.2806815528857], c = [-0.00778489400243029, -0.322396458041136, -2.40075827716184, -2.54973253934373, 4.37466414146497, 2.93816398269878], d = [0.00778469570904146, 0.32246712907004, 2.445134137143, 3.75440866190742];
    const pl = 0.02425; let q, r;
    if (p < pl) { q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
    if (p <= 1 - pl) { q = p - 0.5; r = q * q; return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1); }
    q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
  }
};
/* ---------- models ---------- */
const M = {
  solve(A, b) { const n = b.length, m = A.map((r, i) => [...r, b[i]]); for (let c = 0; c < n; c++) { let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(m[r][c]) > Math.abs(m[p][c])) p = r;[m[c], m[p]] = [m[p], m[c]]; const v = m[c][c] || 1e-12; for (let r = 0; r < n; r++) { if (r === c) continue; const f = m[r][c] / v; for (let k = c; k <= n; k++) m[r][k] -= f * m[c][k]; } } return m.map((r, i) => r[n] / (r[i] || 1e-12)); },
  ols(X, y, ridge = 1e-6) {

    const beta = M.solve(A, b), predict = x => beta[0] + x.reduce((s, v, j) => s + v * beta[j + 1], 0);
    const yh = X.map(predict), my = S.mean(y), ssr = S.sum(y.map((v, i) => (v - yh[i]) ** 2)), sst = S.sum(y.map(v => (v - my) ** 2));

  },
  scaler(X) { const k = X[0].length, mu = [], sd = []; for (let j = 0; j < k; j++) { const c = X.map(r => r[j]); mu.push(S.mean(c)); sd.push(S.sd(c) || 1); } return { mu, sd, t: r => r.map((v, j) => (v - mu[j]) / sd[j]) }; },
  logit(X, y, { iters = 400, lr = 0.3, l2 = 0.001 } = {}) {
    const sc = M.scaler(X), Z = X.map(sc.t), k = Z[0].length, n = Z.length; let w = new Array(k).fill(0), b = 0;
    for (let it = 0; it < iters; it++) { const g = new Array(k).fill(0); let gb = 0; for (let i = 0; i < n; i++) { const p = S.sigmoid(b + Z[i].reduce((s, v, j) => s + v * w[j], 0)), e = p - y[i]; gb += e; for (let j = 0; j < k; j++) g[j] += e * Z[i][j]; } b -= lr * gb / n; for (let j = 0; j < k; j++) w[j] -= lr * (g[j] / n + l2 * w[j]); }
    const z = x => { const s = sc.t(x); return b + s.reduce((a, v, j) => a + v * w[j], 0); };
    return { w, b, sc, predict: x => S.sigmoid(z(x)), contrib: x => sc.t(x).map((v, j) => v * w[j]) };
  },
  auc(s, y) { const idx = S.range(s.length).sort((a, b) => s[a] - s[b]); let r = 0, np = 0, nn = 0; idx.forEach((i, rank) => { if (y[i]) { r += rank + 1; np++; } else nn++; }); return np && nn ? (r - np * (np + 1) / 2) / (np * nn) : 0.5; },
  kmeans(X, k, rng, iters = 60) {
    const n = X.length, d2 = (a, b) => a.reduce((s, v, j) => s + (v - b[j]) ** 2, 0);
    const C = [X[Math.floor(rng() * n)].slice()];
    while (C.length < k) { const ds = X.map(x => Math.min(...C.map(c => d2(x, c)))); const t = S.sum(ds); let r = rng() * t, i = 0; for (; i < n; i++) { r -= ds[i]; if (r <= 0) break; } C.push(X[Math.min(i, n - 1)].slice()); }
    let L = new Array(n).fill(0);
    for (let it = 0; it < iters; it++) { let ch = 0; for (let i = 0; i < n; i++) { let best = 0, bd = Infinity; for (let c = 0; c < k; c++) { const dd = d2(X[i], C[c]); if (dd < bd) { bd = dd; best = c; } } if (L[i] !== best) { ch++; L[i] = best; } } for (let c = 0; c < k; c++) { const m = X.filter((_, i) => L[i] === c); if (m.length) C[c] = m[0].map((_, j) => S.mean(m.map(r => r[j]))); } if (!ch && it) break; }

    return { labels: L, centers: C, inertia };
  },
  silhouette(X, L, idx) { const d = (a, b) => Math.sqrt(a.reduce((s, v, j) => s + (v - b[j]) ** 2, 0)); const ks = [...new Set(L)]; const vals = idx.map(i => { const by = {}; for (const j of idx) { if (j === i) continue; (by[L[j]] = by[L[j]] || []).push(d(X[i], X[j])); } const a = S.mean(by[L[i]] || [0]); const b = Math.min(...ks.filter(k => k !== L[i] && by[k]).map(k => S.mean(by[k]))); return (b - a) / Math.max(a, b); }); return S.mean(vals); },
  pca2(Z) {
    const k = Z[0].length, C = S.range(k).map(p => S.range(k).map(q => S.mean(Z.map(r => r[p] * r[q])))); const vecs = []; let A = C.map(r => r.slice());

  holt(y, a = 0.4, b = 0.2, h = 6) { let l = y[0], t = y[1] - y[0]; const fit = [y[0]]; for (let i = 1; i < y.length; i++) { const pl = l; fit.push(l + t); l = a * y[i] + (1 - a) * (l + t); t = b * (l - pl) + (1 - b) * t; } return { fit, fc: S.range(h).map(i => l + (i + 1) * t) }; },

  off(msg) { ["#brief", "#send", "#q"].forEach(s => $(s).disabled = true); $("#chips").hidden = true; AI.sys(msg); },
  sys(t) { const d = document.createElement("div"); d.className = "msg sys"; d.textContent = t; $("#log").append(d); d.scrollIntoView({ block: "nearest" }); },
  ctx() { const R = RESULT; const c = { tool: TOOLDEF.title, company: TOOLDEF.company, problem: TOOLDEF.statement, controls: STATE.p, algorithm: TOOLDEF.steps.map((s, i) => s[0] + (R.steps && R.steps[i] ? " -> " + R.steps[i] : "")), kpis: R.kpis.map(k => `${k.label}: ${k.value}${k.note ? " (" + k.note + ")" : ""}`), results: R.context, recommendations: R.recs.map(r => `${r.title}: ${r.body} ${r.impact || ""}`) }; let s = JSON.stringify(c); if (s.length > 30000) s = s.slice(0, 30000); return s; },
  async ask(q, oneShot) {

    const rules = `You are the AI analyst built into "${TOOLDEF.title}", a decision tool prepared for ${TOOLDEF.company}. Answer the manager's question using ONLY the analysis results in the JSON below, quoting the actual numbers. The data is illustrative sample data generated for this demo, so never claim these are ${TOOLDEF.company}'s real figures. Write like an experienced consultant talking to a busy manager: short paragraphs or a few bullets, plain words, under 220 words unless asked for more. Do not use em dashes. If the results do not answer the question, say what extra data would be needed.\n\nRESULTS JSON:\n${AI.ctx()}`;

      a.innerHTML = AI.md(text) + (truncated ? `<p class="small">Answer was cut short. Ask for less at a time.</p>` : "");

    } catch (e) {
      if (e && e.text && e.code !== "refused") a.innerHTML = AI.md(e.text); else a.textContent = "";

    } finally { if (!$("#q").disabled) ["#brief", "#send"].forEach(s => $(s).disabled = false); $("#stop").hidden = true; }
  },
  md(t) {
    const lines = esc(t).split(/\n/); let out = "", inL = false;
    const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
    for (const ln of lines) { const m = ln.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/); if (m) { if (!inL) { out += "<ul>"; inL = true; } out += `<li>${inline(m[1])}</li>`; continue; } if (inL) { out += "</ul>"; inL = false; } const hm = ln.match(/^#{1,6}\s+(.*)/); if (hm) out += `<h5>${inline(hm[1])}</h5>`; else if (ln.trim()) out += `<p>${inline(ln)}</p>`; }
    if (inL) out += "</ul>"; return out;
  }
};
